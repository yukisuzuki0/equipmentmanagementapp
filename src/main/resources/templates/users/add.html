<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>ユーザー登録画面</title>
  <link rel="stylesheet" type="text/css" href="../../static/css/formstyle.css" th:href="@{/css/formstyle.css}" />
</head>

<body>
  <div class="card">
    <h1>ユーザー登録</h1>
    <form th:action="@{/users/create}" th:object="${userForm}" method="post">
      <div>
        <label for="username">ユーザID</label>
        <input type="text" id="username" name="username" th:field="*{username}" th:errorclass="error-input" />
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-messages"></span>
      </div>

      <div>
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" th:field="*{password}" th:errorclass="error-input" />
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-messages"></span>
      </div>

      <input type="submit" value="作成" class="btn-submit" />
    </form>
  </div>
</body>

</html>
